[package]
name = "kletia-intent-control-plane-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false
description = "Policy V2 workflow, exact route leaves and nullifier control plane for Kletia"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
