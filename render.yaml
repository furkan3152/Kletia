services:
  # Arc Testnet Backend
  - type: web
    name: kletia-backend
    env: docker
    rootDir: backend/arc_testnet
    plan: starter
    disk:
      name: kletia-wallets
      mountPath: /app/wallets
      sizeGB: 1
    envVars:
      - key: PORT
        value: 3000

  # Arc Testnet Frontend
  - type: web
    name: kletia-frontend
    env: static
    rootDir: frontend/arc_testnet
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://kletia-backend.onrender.com
