<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/kletia-logo.png" />
    <link rel="apple-touch-icon" href="/kletia-logo.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Kletia: intent routing across nine networks</title>
    <meta
      name="description"
      content="Kletia turns one sentence, like “bridge 100 USDC from Ethereum to Base”, into planned, quoted transactions on nine networks that your users sign in their own wallets. REST API, TypeScript SDK, React widget and iframe embed. MIT licensed."
    />
    <!-- Browser chrome in the page's paper per theme (applySiteTheme keeps it in step with the site's own theme switch). -->
    <meta name="theme-color" content="#D6D2C8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://kletiaai.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kletia" />
    <meta property="og:title" content="Kletia: intent routing across nine networks" />
    <meta
      property="og:description"
      content="Kletia turns one sentence, like “bridge 100 USDC from Ethereum to Base”, into planned, quoted transactions on nine networks that your users sign in their own wallets. REST API, TypeScript SDK, React widget and iframe embed. MIT licensed."
    />
    <meta property="og:url" content="https://kletiaai.xyz/" />
    <meta property="og:image" content="https://kletiaai.xyz/kletia-logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kletia: intent routing across nine networks" />
    <meta
      name="twitter:description"
      content="Kletia turns one sentence, like “bridge 100 USDC from Ethereum to Base”, into planned, quoted transactions on nine networks that your users sign in their own wallets. REST API, TypeScript SDK, React widget and iframe embed. MIT licensed."
    />
    <meta name="base:app_id" content="6a31a6981f144514c3aaa376" />
    <!--
      Static frame: before any script runs, the first paint is the page's
      paper and the site header's frame in the visitor's theme, not a loading
      plate. This script only marks <html> (theme, the site's motion setting,
      which frame to show); the entry and the router take over from there, and
      SiteBootFallback (router.tsx) prints the same frame while the shell
      loads. No React is pre-rendered.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var path = location.pathname;
        var embed = /^\/embed(?:\/|$)/.test(path);
        var desk = path === "/app" || path.indexOf("/app/") === 0;
        root.setAttribute("data-kl-boot", embed ? "none" : desk ? "paper" : "site");
        if (embed) return;
        var theme = null;
        try {
          theme = localStorage.getItem("kletia-site-theme");
          if (localStorage.getItem("kletia-site-motion") === "off") root.setAttribute("data-motion", "off");
        } catch (error) {
          theme = null;
        }
        if (theme !== "light" && theme !== "dark") {
          try {
            theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (error) {
            theme = "light";
          }
        }
        if (theme === "dark") root.classList.add("dark");
        root.classList.add("kletia-site");
        root.style.colorScheme = theme;
      })();
    </script>
    <style>
      html[data-kl-boot="site"],
      html[data-kl-boot="paper"] {
        background-color: #d6d2c8;
      }
      html.dark[data-kl-boot="site"],
      html.dark[data-kl-boot="paper"] {
        background-color: #0e0e10;
      }
      .kl-boot {
        min-height: 100vh;
        background-color: #d6d2c8;
      }
      .dark .kl-boot {
        background-color: #0e0e10;
      }
      html[data-kl-boot="none"] .kl-boot {
        display: none;
      }
      .kl-boot__bar {
        box-sizing: border-box;
        height: 75px;
        border-bottom: 3px solid #121212;
        background-color: #d6d2c8;
      }
      .dark .kl-boot__bar {
        border-bottom-color: #4a4a52;
        background-color: #0e0e10;
      }
      html[data-kl-boot="paper"] .kl-boot__bar {
        display: none;
      }
      .kl-boot__in {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        max-width: 80rem;
        height: 72px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .kl-boot__mark {
        box-sizing: border-box;
        width: 44px;
        height: 44px;
        border: 1px solid #a9a499;
        border-radius: 9px;
        background-color: #e6e2d9;
        box-shadow: 0 2px 0 #9e998e;
      }
      .dark .kl-boot__mark {
        border-color: #3a3a40;
        background-color: #232327;
        box-shadow: 0 2px 0 #000;
      }
      .kl-boot__word {
        width: 92px;
        height: 18px;
        background-color: #121212;
        opacity: 0.12;
      }
      .dark .kl-boot__word {
        background-color: #f2f0ea;
      }
      @media (min-width: 640px) {
        .kl-boot__in {
          padding: 0 24px;
        }
      }
      @media (min-width: 1024px) {
        .kl-boot__in {
          padding: 0 32px;
        }
      }
    </style>
    <!--
      Card machine type: Funnel Display, Funnel Sans and Geist Mono from Google Fonts
      (Latin subsets by unicode-range, font-display: swap), and Doto subset to the characters of
      the card serial and the status LCD (text=). The stylesheet is added by the script below so
      it never blocks the first paint; /embed (the widget, its own type) skips it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        if (/^\/embed(?:\/|$)/.test(location.pathname)) return;
        var base = "https://fonts.googleapis.com/css2?display=swap&family=";
        var hrefs = [
          base + "Funnel+Display:wght@500..800&family=Funnel+Sans:wght@300..800&family=Geist+Mono:wght@400..600",
          base + "Doto:wght@800&text=" + encodeURIComponent("#0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ .,:/-%\u00b7\u2014"),
        ];
        for (var i = 0; i < hrefs.length; i += 1) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = hrefs[i];
          document.head.appendChild(link);
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Kletia",
        "url": "https://kletiaai.xyz/",
        "applicationCategory": "FinanceApplication",
        "applicationSubCategory": "Cross-network intent routing",
        "operatingSystem": "Web",
        "description": "Intent routing across nine networks from one sentence: a console for people, and an API, SDK and widget for teams who want routes inside their own product.",
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true,
        "image": "https://kletiaai.xyz/kletia-logo.png",
        "codeRepository": "https://github.com/furkan3152/Kletia",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <noscript>Kletia needs JavaScript to plan and sign intents. Source: https://github.com/furkan3152/Kletia</noscript>
    <div id="root"><div class="kl-boot" aria-hidden="true"><div class="kl-boot__bar"><div class="kl-boot__in"><span class="kl-boot__mark"></span><span class="kl-boot__word"></span></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
