name: Release packages

# Publishes @kletia/core, @kletia/sdk, @kletia/widget and @kletia/cli to npm with provenance
# when a tag such as `packages-v0.1.0` is pushed. The tag version must equal the
# version in every package manifest. Requires the NPM_TOKEN repository secret.
on:
  push:
    tags:
      - "packages-v*"

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @kletia packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install workspace dependencies
        run: npm ci

      - name: Check tag matches package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="${TAG#packages-v}"
          for name in core sdk widget cli; do
            actual=$(node -p "require('./packages/$name/package.json').version")
            if [ "$actual" != "$expected" ]; then
              echo "packages/$name is $actual but the tag is $expected" >&2
              exit 1
            fi
          done

      - name: Test and verify package contents
        run: |
          npm run test:packages
          npm run check:packages

      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for name in core sdk widget cli; do
            npm publish --workspace "@kletia/$name" --access public --provenance
          done
