name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            contracts/base/package-lock.json
            contracts/arc/package-lock.json

      - name: Install API dependencies
        run: npm --prefix apps/api ci --include=dev --legacy-peer-deps

      - name: Install web dependencies
        run: npm --prefix apps/web ci --include=dev --legacy-peer-deps

      - name: Install Base contract dependencies
        run: npm --prefix contracts/base ci --include=dev --legacy-peer-deps

      - name: Install Arc contract dependencies
        run: npm --prefix contracts/arc ci --include=dev --legacy-peer-deps

      - name: Verify structure, applications and contracts
        run: npm run verify

      - name: Reject high-severity runtime advisories
        run: |
          npm --prefix apps/api audit --omit=dev --audit-level=high
          npm --prefix apps/web audit --omit=dev --audit-level=high
          npm --prefix contracts/base audit --omit=dev --audit-level=high
          npm --prefix contracts/arc audit --omit=dev --audit-level=high
