[package]
name = "kletia-policy-verifier-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false
description = "Versioned Kletia policy verifier registry and fail-closed verifier dispatcher"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
hex = "0.4.3"
kletia-policy-groth16-verifier = { path = "../policy-groth16-verifier" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
