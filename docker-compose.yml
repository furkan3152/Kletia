# Self-hosted Kletia for local evaluation: PostgreSQL + API + web.
#
# Build the images from this checkout:
#   KLETIA_PLATFORM_SECRET=$(openssl rand -hex 32) docker compose up --build
#
# Or run the published images (built by .github/workflows/images.yml):
#   export KLETIA_API_IMAGE=ghcr.io/furkan3152/kletia-api:main
#   export KLETIA_WEB_IMAGE=ghcr.io/furkan3152/kletia-web:main
#   KLETIA_PLATFORM_SECRET=$(openssl rand -hex 32) docker compose up --pull always --no-build
#
# Web: http://localhost:10000   API: http://localhost:3001 (/api and /v1)
#
# The API runs in development mode here so the browser may call it over local
# HTTP. For a public deployment use HTTPS origins, NODE_ENV=production,
# CORS_ORIGINS and your own RPC endpoints (see docs/deployment/self-hosting.md).
name: kletia

services:
  postgres:
    image: postgres:16.10-alpine3.22
    environment:
      POSTGRES_DB: kletia
      POSTGRES_USER: kletia
      POSTGRES_PASSWORD: ${KLETIA_POSTGRES_PASSWORD:-kletia-local-only}
    volumes:
      - kletia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kletia -d kletia"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${KLETIA_API_IMAGE:-kletia-api:local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3001"
      KLETIA_DATABASE_URL: postgres://kletia:${KLETIA_POSTGRES_PASSWORD:-kletia-local-only}@postgres:5432/kletia
      KLETIA_PLATFORM_SECRET: ${KLETIA_PLATFORM_SECRET:?Set KLETIA_PLATFORM_SECRET (openssl rand -hex 32)}
      KLETIA_OPERATOR_API_KEYS: ${KLETIA_OPERATOR_API_KEYS:-}
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      OPTIMISM_RPC_URL: ${OPTIMISM_RPC_URL:-}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      ARC_SWAP_V2_ADDRESS: ${ARC_SWAP_V2_ADDRESS:-}
      ARC_SWAP_V2_RUNTIME_CODEHASH: ${ARC_SWAP_V2_RUNTIME_CODEHASH:-}
      ARC_STAKING_V2_ADDRESS: ${ARC_STAKING_V2_ADDRESS:-}
      ARC_STAKING_V2_RUNTIME_CODEHASH: ${ARC_STAKING_V2_RUNTIME_CODEHASH:-}
      ARC_LENDING_V2_ADDRESS: ${ARC_LENDING_V2_ADDRESS:-}
      ARC_LENDING_V2_RUNTIME_CODEHASH: ${ARC_LENDING_V2_RUNTIME_CODEHASH:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      DEBRIDGE_ACCESS_TOKEN: ${DEBRIDGE_ACCESS_TOKEN:-}
      KLETIA_WEB_ORIGIN: ${KLETIA_WEB_ORIGIN:-http://localhost:10000}
      KLETIA_MCP_ALLOWED_ORIGINS: ${KLETIA_MCP_ALLOWED_ORIGINS:-}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -qO- http://127.0.0.1:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30

  web:
    image: ${KLETIA_WEB_IMAGE:-kletia-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Compiled into the bundle when the image is built; the published image
      # uses these same defaults.
      args:
        VITE_BACKEND_URL: http://localhost:3001
        VITE_ALLOW_LOCAL_BACKEND: "true"
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_ARC_SWAP_V2_ADDRESS: ${VITE_ARC_SWAP_V2_ADDRESS:-}
        VITE_ARC_STAKING_V2_ADDRESS: ${VITE_ARC_STAKING_V2_ADDRESS:-}
        VITE_ARC_LENDING_V2_ADDRESS: ${VITE_ARC_LENDING_V2_ADDRESS:-}
        VITE_ETHEREUM_RPC_URL: ${VITE_ETHEREUM_RPC_URL:-}
        VITE_OPTIMISM_RPC_URL: ${VITE_OPTIMISM_RPC_URL:-}
        VITE_POLYGON_RPC_URL: ${VITE_POLYGON_RPC_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "10000:10000"

volumes:
  kletia-postgres:
