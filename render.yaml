# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  # Kletia API: app routes (/api) and the public platform API (/v1)
  - type: web
    name: kletia-backend
    runtime: node
    branch: main
    plan: free
    region: frankfurt
    # npm workspace build from the repository root. NODE_ENV=production is
    # present during Render builds, so build-time TypeScript is included
    # explicitly; the runtime starts only the emitted JavaScript.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start:api
    domains:
      - api.kletiaai.xyz
    renderSubdomainPolicy: enabled
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    # Deploy only after the repository CI gate succeeds for this commit.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      # The hosted deployment promises every integration; self-hosted
      # deployments may omit optional keys and run in degraded mode.
      - key: KLETIA_REQUIRE_ALL_FEATURES
        value: "true"
      - key: CORS_ORIGINS
        value: https://kletiaai.xyz,https://www.kletiaai.xyz,https://kletia-frontend.onrender.com
      - key: BASE_RPC_URL
        sync: false
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARBITRUM_RPC_URL
        sync: false
      - key: ARBITRUM_MVP_ENABLED
        value: "true"
      - key: SOLANA_RPC_URL
        sync: false
      # Intent-platform networks; unset falls back to keyless public RPCs.
      # Every endpoint must report chain id 1 / 10 / 137 before it is used.
      - key: ETHEREUM_RPC_URL
        sync: false
      - key: OPTIMISM_RPC_URL
        sync: false
      - key: POLYGON_RPC_URL
        sync: false
      - key: SOLANA_DEVNET_RPC_URL
        value: https://api.devnet.solana.com
      - key: JUPITER_API_KEY
        sync: false
      # Durable store for platform intents, API keys and webhooks. The
      # database keeps its original resource name so the existing instance
      # is reused instead of provisioning a new one.
      - key: KLETIA_DATABASE_URL
        fromDatabase:
          name: kletia-stellar-event-archive
          property: connectionString
      - key: KLETIA_PLATFORM_SECRET
        generateValue: true
      - key: KLETIA_OPERATOR_API_KEYS
        sync: false
      # Origin of Studio hand-off links (MCP) and error docs links.
      - key: KLETIA_WEB_ORIGIN
        value: https://kletiaai.xyz
      # Optional exact browser origins allowed to call /v1/mcp.
      - key: KLETIA_MCP_ALLOWED_ORIGINS
        sync: false
      # Cross-network venues (bridge auction). Relay requires a key in
      # production; LI.FI and deBridge DLN work keyless at low limits.
      - key: RELAY_API_KEY
        sync: false
      - key: LIFI_API_KEY
        sync: false
      - key: DEBRIDGE_ACCESS_TOKEN
        sync: false
      - key: ARBITRUM_SEPOLIA_RPC_URL
        sync: false
      - key: ARBITRUM_SEPOLIA_MVP_ENABLED
        value: "true"
      - key: WORKFLOW_SIGNING_SECRET
        generateValue: true
      - key: ARC_VAULT_EXECUTION_MODE
        value: vault_v2
      - key: ARC_VAULT_V2_ADDRESS
        value: "0xBe385e3520C20D44697CC1bEEDc9DF759C3A184d"
      - key: ARC_VAULT_V2_RUNTIME_CODEHASH
        value: "0xa6cb476a1243a6d9bc71909a5774d1340061e91bcb47cd8aea3df1f5444bec1f"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: WEBACY_API_KEY
        sync: false
      - key: ALLORA_API_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      - key: ACROSS_API_KEY
        sync: false
      - key: ACROSS_INTEGRATOR_ID
        sync: false
      - key: ACROSS_MAX_RELAY_FEE_BPS
        value: "300"
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: CDP_API_KEY_NAME
        sync: false
      - key: CDP_API_KEY_PRIVATE_KEY
        sync: false
      - key: CDP_PAYMASTER_POLICY_ID
        sync: false
      - key: PAYMASTER_PROXY_ENABLED
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: X402_MAX_PRICE_ATOMIC
        value: "100000000"
      - key: X402_DEFAULT_PRICE_USDC
        value: "0.01"
      - key: X402_BUYER_MAX_PAYMENT_USDC
        value: "1"
      - key: KLETIA_X402_ATTESTATION_REGISTRY_ADDRESS
        value: "0xE69DE5A5E92F4a52b15C651C1C1fc0fE36143889"
      - key: KLETIA_X402_ATTESTATION_OWNER_ADDRESS
        value: "0x84f19Fdfd8C50C6349BFe86Cd90BE131387ab47D"
      - key: KLETIA_V2_GUARDIAN_SAFE
        value: "0xCae3520A4348BEB2b74Ef52E8be2dE06f57fC0Bc"
      - key: X402_TREASURY_ADDRESS
        sync: false
      # Token deployment is independent from swap routing. This exact
      # LaunchFactory deployment is live and revalidated at one
      # pinned Base block for every compiled deploy_token intent.
      - key: BASE_TOKEN_DEPLOYMENT_MODE
        value: launch_v2
      - key: KLETIA_LAUNCH_FACTORY_V2_ADDRESS
        value: "0x1D62Ac5e19af7688EbC57f262bbB9959dd78e043"
      - key: KLETIA_LAUNCH_FACTORY_V2_EVIDENCE_JSON
        value: '{"schemaVersion":"kletia_launch_factory_v2_direct_safe_deployment_v2","validationStatus":"validated","chainId":8453,"observedAtBlock":"49936548","factory":"0x1D62Ac5e19af7688EbC57f262bbB9959dd78e043","factoryCodehash":"0xa28d7ef44ecff154d4b24a2f362868bf29e8a9ca7f172d8b0e3cad2b5fc80e81","ownerAuthority":"0x84f19Fdfd8C50C6349BFe86Cd90BE131387ab47D","ownerAuthorityCodehash":"0xd7d408ebcd99b2b70be43e20253d6d92a8ea8fab29bd3be7f55b10032331fb4c","ownerAuthorityKind":"safe_2_of_2","treasurySafe":"0x64261D1AC0133FB1BB2153e1dCa7B081cd9d05fC","treasurySafeCodehash":"0xd7d408ebcd99b2b70be43e20253d6d92a8ea8fab29bd3be7f55b10032331fb4c","pendingTreasury":"0x0000000000000000000000000000000000000000","factoryFeeCap":"10000000000000000","maxTokenSupply":"1000000000000000000000000000000000000","maxNameBytes":"64","maxSymbolBytes":"16"}'
      - key: BASE_SWAP_EXECUTION_MODE
        value: intent_v2
      # Verified direct-Safe router; runtime validation is fail-closed and
      # never falls back to the legacy execution path.
      - key: KLETIA_INTENT_ROUTER_V2_ADDRESS
        value: "0xf9BaA05c71c2078A43f6831Eca88220b42932413"
      - key: KLETIA_INTENT_ROUTER_V2_EVIDENCE_JSON
        value: '{"schemaVersion":"kletia_base_intent_v2_deployment_v1","validationStatus":"validated","chainId":8453,"observedAtBlock":"49936501","router":"0xf9BaA05c71c2078A43f6831Eca88220b42932413","routerCodehash":"0x9341d0e8f68d7de4273a47b6f495f4b99335fa9d851bafa3204a91dc3ae2fb52","wrappedNative":"0x4200000000000000000000000000000000000006","wrappedNativeCodehash":"0x8a3a1f6a9f9dce633117adee5b458245835a8645a8c8726a26382a4622508b1c","feeBps":10,"adapters":[{"kind":"uniswap_v2_compatible","reviewStatus":"reviewed","protocolId":"uniswap","enabled":true,"adapter":"0xb21C455ceE9ECb4BD0cf19A88d771065db45592b","target":"0x4752ba5DBc23f44D87826276BF6Fd6b1C372aD24","spender":"0x4752ba5DBc23f44D87826276BF6Fd6b1C372aD24","factory":"0x8909Dc15e40173Ff4699343b6eB8132c65e18eC6","adapterCodehash":"0x0fb7c899f3f97856ee6a83f8e7eb5ede10c341f52e64e92658b35471d3a1dbd7","targetCodehash":"0xec2a9bc649a4a1f23eee18c570628b28c03c665cdd7ebbdb3c46a6c4007959c1","spenderCodehash":"0xec2a9bc649a4a1f23eee18c570628b28c03c665cdd7ebbdb3c46a6c4007959c1","factoryCodehash":"0xbab145d02e7005f0d84c6c1639d39b799b0ea16df99ebbdaf5a14d9da820b4e0","adapterConfigurationHash":"0xfbaf94530df666febfb537d12153342f741a4786b39a99cafd708e12a4de6d36","adapterConfigHash":"0x56c6c7092dc5af58ddc28ad856ae4cd369b41960ff6d5f5d3a73fa34a6f3c6ad"}]}'

  # Kletia web: home, console, studio and developer portal
  - type: web
    name: kletia-frontend
    runtime: static
    branch: main
    # Vite, TypeScript and React types are build-time devDependencies.
    buildCommand: npm ci --include=dev && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(self)
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /
        name: X-Frame-Options
        value: SAMEORIGIN
      # No X-Frame-Options rule on /index.html: SPA routes are rewritten to it,
      # and the header must never reach /embed. Unlisted paths are covered by
      # the app's own cross-origin frame guard.
      - path: /app
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /app/*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /studio
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /studio/*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /developers
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /developers/*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /networks
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /networks/*
        name: X-Frame-Options
        value: SAMEORIGIN
      # The embeddable widget is the only page other sites may frame.
      - path: /embed
        name: Content-Security-Policy
        value: frame-ancestors *
      - path: /embed/*
        name: Content-Security-Policy
        value: frame-ancestors *
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    domains:
      - kletiaai.xyz
    renderSubdomainPolicy: enabled
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: VITE_BACKEND_URL
        value: https://api.kletiaai.xyz
      - key: VITE_BASE_RPC_URL
        value: https://mainnet.base.org
      - key: VITE_ALLOW_PUBLIC_BASE_RPC_FALLBACK
        value: "false"
      - key: VITE_ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: VITE_ARBITRUM_RPC_URL
        value: https://arb1.arbitrum.io/rpc
      - key: VITE_ARBITRUM_SEPOLIA_RPC_URL
        sync: false
      # Optional wallet RPCs for intent steps; unset uses the public endpoints
      # built into the app (never a keyed URL: VITE_* values are public).
      - key: VITE_ETHEREUM_RPC_URL
        sync: false
      - key: VITE_OPTIMISM_RPC_URL
        sync: false
      - key: VITE_POLYGON_RPC_URL
        sync: false
      - key: VITE_ARBITRUM_MVP_ENABLED
        value: "true"
      - key: VITE_ARC_VAULT_EXECUTION_MODE
        value: vault_v2
      - key: VITE_ARC_VAULT_V2_ADDRESS
        value: "0xBe385e3520C20D44697CC1bEEDc9DF759C3A184d"
      - key: VITE_BASE_SWAP_EXECUTION_MODE
        value: intent_v2
      - key: VITE_BASE_PAYMASTER_ENABLED
        value: "false"
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false

databases:
  - name: kletia-stellar-event-archive
    plan: free
    region: frankfurt
    databaseName: kletia_stellar_events
    user: kletia_stellar_archive
    ipAllowList: []
