name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kletia
          POSTGRES_PASSWORD: kletia_ci_tests
          POSTGRES_DB: kletia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kletia -d kletia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KLETIA_TEST_DATABASE_URL: postgres://kletia:kletia_ci_tests@127.0.0.1:5432/kletia_test
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/base/package-lock.json
            contracts/arc/package-lock.json

      - name: Install workspace dependencies (apps and packages)
        run: npm ci

      - name: Install Base contract dependencies
        run: npm --prefix contracts/base ci --include=dev --legacy-peer-deps

      - name: Install Arc contract dependencies
        run: npm --prefix contracts/arc ci --include=dev --legacy-peer-deps

      - name: Verify structure, packages, applications and contracts
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile browser journeys
        run: npm run test:e2e

      - name: Reject high-severity runtime advisories
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix contracts/base audit --omit=dev --audit-level=high
          npm --prefix contracts/arc audit --omit=dev --audit-level=high
